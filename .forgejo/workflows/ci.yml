name: CI

# Lint + testes (migrations, API e PWA de ponta a ponta) em todo push e PR.
# Roda nos dois runners (ubuntu-latest e debian) — cada imagem traz uma
# versão diferente de PHP, o que de quebra testa compatibilidade.
#
# O checkout é feito com git puro (sem actions/checkout) pra não depender
# de Node.js na imagem do runner.

on:
  push:
    branches: [main, develop, release, 'feat/**']
  pull_request:
    branches: [main, develop, release]

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, debian]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
          SERVIDOR: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          command -v git >/dev/null || { apt-get update -qq && apt-get install -y -qq git ca-certificates >/dev/null; }
          git init -q .
          git remote add origin "${SERVIDOR/:\/\//://ci:$TOKEN@}/$REPO.git"
          git fetch -q --depth=1 origin "$SHA"
          git checkout -q FETCH_HEAD
          git log -1 --format='%h %s'

      - name: Dependências
        run: bash scripts/ci/instalar-dependencias.sh

      - name: Lint
        run: bash scripts/ci/lint.sh

  testes:
    name: Testes (${{ matrix.runner }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, debian]
    runs-on: ${{ matrix.runner }}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: argos_root
    env:
      DB_HOST: mysql
      DB_ROOT_SENHA: argos_root
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
          SERVIDOR: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          command -v git >/dev/null || { apt-get update -qq && apt-get install -y -qq git ca-certificates >/dev/null; }
          git init -q .
          git remote add origin "${SERVIDOR/:\/\//://ci:$TOKEN@}/$REPO.git"
          git fetch -q --depth=1 origin "$SHA"
          git checkout -q FETCH_HEAD

      - name: Dependências
        run: bash scripts/ci/instalar-dependencias.sh

      - name: Migrations + testes de integração
        run: bash scripts/ci/testes-integracao.sh

      - name: Apache real em subdiretório (.htaccess de produção)
        run: bash scripts/ci/testes-apache.sh
