<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Argos — banner da apresentação</title>
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; width: 100vw; height: auto; max-height: 100vh; object-fit: contain; cursor: pointer; }
</style>
</head>
<body>
<canvas width="1920" height="1080"></canvas>
<script src="comum.js"></script>
<script>
// Banner que fica no telão enquanto o projeto é apresentado. No vídeo completo ele continua a
// vinheta: começa igual ao último quadro dela (o logo do CIDIT no meio) e, em 2,6 s, o logo vai
// pro canto, o fundo clareia pro azul e entram o ARGOS, a frase, os destaques e os celulares.
// O último quadro é o banner parado (exportado em PNG pelo ferramentas/montar.mjs).

const ENTRADA = 2.6;
const SEGURA = Number(PARAMETROS.get('segura') ?? 4);     // quanto tempo o banner fica parado no fim
const RELOGIO = Number(PARAMETROS.get('relogio')) || 0;    // continua a grade do fundo da vinheta
const DURACAO = ENTRADA + SEGURA;
window.FPS = FPS;
window.FRAMES = Math.max(1, Math.round(DURACAO * FPS));
window.CUES = [];

const TELAS = '../../build/telas/';
const LOGO_CIDIT = imagem('../../web/images/logo-cidit.png');
const CELULAR_FRENTE = imagem(TELAS + 'app-04-retiradas.png');
const CELULAR_ATRAS = imagem(TELAS + 'app-06-chamada.png');

const AZUL_CENTRO = '#12407e';
const AZUL_BORDA = '#061c3a';
const DESTAQUES = ['Chamada pelo celular', 'Livro do Dia validado', 'Painel de Comando em tempo real'];

// ARG(olho)S, alinhado à esquerda em x
function desenharLetreiro(ctx, x, base, tamanho, alfa) {
    if (alfa <= 0) return;
    ctx.save();
    ctx.globalAlpha = alfa;
    ctx.font = `700 ${tamanho}px ${FONTE_TITULO}`;
    ctx.letterSpacing = `${Math.round(tamanho * 0.08)}px`;
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = COR.branco;
    ctx.shadowColor = 'rgba(0,0,0,0.35)';
    ctx.shadowBlur = 20;
    const arg = ctx.measureText('ARG').width;
    const vao = tamanho * 0.95;
    ctx.fillText('ARG', x, base);
    ctx.fillText('S', x + arg + vao, base);
    ctx.restore();
    ctx.save();
    ctx.globalAlpha = alfa;
    desenharOlho(ctx, x + arg + vao / 2, base - tamanho * 0.36, tamanho * 1.12, 1, 1);
    ctx.restore();
}

function texto(ctx, conteudo, x, y, fonte, cor, alfa, espacamento = '0px') {
    if (alfa <= 0) return;
    ctx.save();
    ctx.globalAlpha = alfa;
    ctx.font = fonte;
    ctx.letterSpacing = espacamento;
    ctx.fillStyle = cor;
    ctx.fillText(conteudo, x + 30 * (1 - alfa), y);
    ctx.restore();
}

window.draw = function (quadro) {
    const ctx = document.querySelector('canvas').getContext('2d');
    const t = quadro / FPS;

    // fundo: da noite da vinheta pro azul
    const azul = suave(trecho(t, 0.2, 1.4));
    desenharFundo(ctx, t + RELOGIO, 1, [misturarCor(COR.azulEscuro, AZUL_CENTRO, azul), misturarCor(COR.noite, AZUL_BORDA, azul)]);

    // celulares entrando pela direita, com um brilho vermelho atrás
    const cel = saida(trecho(t, 0.8, 1.9));
    const cel2 = saida(trecho(t, 0.95, 2.05));
    if (cel > 0) {
        const halo = ctx.createRadialGradient(1500, 560, 40, 1500, 560, 560);
        halo.addColorStop(0, `rgba(255,31,45,${0.28 * cel})`);
        halo.addColorStop(1, 'rgba(255,31,45,0)');
        ctx.fillStyle = halo;
        ctx.fillRect(900, 0, LARGURA - 900, ALTURA);
    }
    desenharCelular(ctx, CELULAR_ATRAS, 1705 + 700 * (1 - cel2), 590, 860, cel2, 0.07);
    desenharCelular(ctx, CELULAR_FRENTE, 1420 + 650 * (1 - cel), 555, 960, cel, -0.04);

    // logo do CIDIT: do meio (como a vinheta terminou) pro canto
    const vai = entradaSaida(trecho(t, 0.1, 1.3));
    desenharLogoCidit(ctx, LOGO_CIDIT, misturar(LARGURA / 2, 240, vai), misturar(470, 905, vai), 300, 1, misturar(1.04, 98 / 300, vai));
    legenda(ctx, 'Um projeto do CIDIT · Corpo de Alunos da EEAR', LARGURA / 2, 880, 44, t, -1, 0.4, 'center', COR.branco);

    // ARGOS, a frase e os destaques
    desenharLetreiro(ctx, 140 - 40 * (1 - saida(trecho(t, 0.9, 1.6))), 380, 210, saida(trecho(t, 0.9, 1.6)));
    texto(ctx, 'A retirada de faltas do Corpo de Alunos,', 145, 490, `400 46px ${FONTE_TEXTO}`, COR.branco, saida(trecho(t, 1.2, 1.8)));
    texto(ctx, 'no celular do aluno de serviço.', 145, 550, `400 46px ${FONTE_TEXTO}`, COR.branco, saida(trecho(t, 1.3, 1.9)));
    DESTAQUES.forEach((d, i) => {
        const a = saida(trecho(t, 1.5 + i * 0.12, 2.1 + i * 0.12));
        if (a <= 0) return;
        const y = 650 + i * 56;
        ctx.save();
        ctx.globalAlpha = a;
        ctx.fillStyle = COR.vermelho;
        ctx.shadowColor = COR.vermelho;
        ctx.shadowBlur = 12;
        ctx.fillRect(147 + 30 * (1 - a), y - 22, 14, 14);
        ctx.restore();
        texto(ctx, d.toUpperCase(), 180, y - 4, `600 34px ${FONTE_TITULO}`, '#d6e2f5', a, '2px');
    });

    // quem fez, ao lado do logo
    const quem = saida(trecho(t, 1.6, 2.3));
    texto(ctx, 'Um projeto do CIDIT', 370, 895, `700 46px ${FONTE_TITULO}`, COR.branco, quem, '1px');
    texto(ctx, 'Corpo de Alunos da EEAR · Esquadrão Prata · Turma Ikarus 37', 370, 940, `400 28px ${FONTE_TEXTO}`, '#b9c6dc', quem);
};

iniciarPrevia();
</script>
</body>
</html>
