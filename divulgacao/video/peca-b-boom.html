<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Argos — vinheta BOOM</title>
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; width: 100vw; height: auto; max-height: 100vh; object-fit: contain; cursor: pointer; }
</style>
</head>
<body>
<canvas width="1920" height="1080"></canvas>
<script src="comum.js"></script>
<script>
// Peça B (issue 60, parte 3 do roteiro): tela escura → o olho do Argos abre e pisca em
// vermelho → o raio cai e estoura → ARGOS → logo do CIDIT. 9,5 s, 120 BPM (um tempo = 0,5 s).

const DURACAO = 9.5;
window.FPS = FPS;
window.FRAMES = DURACAO * FPS;

const BOOM = 3.0;                    // o raio sai do olho
const IMPACTO = BOOM + 7 / FPS;      // e chega no chão 7 quadros depois (como no app)
const LOGO = 5.0;
window.CUES = [IMPACTO, LOGO];   // o clarão do impacto é o ponto forte, não a saída do raio

const LOGO_CIDIT = imagem('../../web/images/logo-cidit.png');
const OLHO = { x: LARGURA / 2, y: 430, tamanho: 380 };
const RAIO = montarRaio(37, OLHO.x, OLHO.y + 60, OLHO.x + 70, ALTURA - 40);

// Abertura do olho: abre, pisca duas vezes, fica aberto.
function aberturaDoOlho(t) {
    const abre = saida(trecho(t, 1.1, 1.7));
    const piscada = (c) => { const d = Math.abs(t - c) / 0.11; return d < 1 ? d * d : 1; };
    return abre * piscada(2.1) * piscada(2.55);
}

// Posição do olho dentro do letreiro ARG(olho)S.
function letreiro(ctx) {
    const tamanho = 230;
    ctx.save();
    ctx.font = `700 ${tamanho}px ${FONTE_TITULO}`;
    ctx.letterSpacing = `${Math.round(tamanho * 0.08)}px`;
    const arg = ctx.measureText('ARG').width;
    const s = ctx.measureText('S').width;
    const vao = tamanho * 0.95;
    const total = arg + vao + s;
    const x0 = LARGURA / 2 - total / 2;
    const base = 600;
    ctx.restore();
    return { tamanho, x0, arg, vao, base, olhoX: x0 + arg + vao / 2, olhoY: base - tamanho * 0.36 };
}

function desenharLogoCidit(ctx, cx, cy, raioCirculo, alfa, escala) {
    if (!imagemOk(LOGO_CIDIT) || alfa <= 0) return;
    ctx.save();
    ctx.globalAlpha = alfa;
    ctx.translate(cx, cy);
    ctx.scale(escala, escala);
    ctx.shadowColor = COR.vermelho;
    ctx.shadowBlur = 70;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(0, 0, raioCirculo, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.clip();
    const lado = raioCirculo * 2 / 0.97;
    ctx.drawImage(LOGO_CIDIT, -lado / 2, -lado / 2, lado, lado);
    ctx.restore();
}

window.draw = function (quadro) {
    const ctx = document.querySelector('canvas').getContext('2d');
    const t = quadro / FPS;
    const desdeImpacto = t - IMPACTO;

    // tremor depois do impacto
    const tremor = desdeImpacto > 0 ? 26 * Math.exp(-desdeImpacto * 7) : 0;
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, Math.sin(quadro * 2.3) * tremor, Math.cos(quadro * 1.7) * tremor);

    // fundo: some no "respiro" antes do BOOM, volta depois
    const respiro = trecho(t, 2.75, 2.95) * (1 - trecho(t, IMPACTO, IMPACTO + 0.4));
    desenharFundo(ctx, t, limitar(trecho(t, 0, 1.5) * (1 - respiro)));
    if (respiro > 0) { ctx.fillStyle = `rgba(0,0,0,${0.7 * respiro})`; ctx.fillRect(-50, -50, LARGURA + 100, ALTURA + 100); }

    // o olho: entra, abre, pisca, vai pro letreiro
    const L = letreiro(ctx);
    const vai = entradaSaida(trecho(t, 3.45, 4.05));
    const sai = 1 - trecho(t, LOGO, LOGO + 0.4);
    const ox = misturar(OLHO.x, L.olhoX, vai);
    const oy = misturar(OLHO.y, L.olhoY, vai);
    const carga = 1 + 0.08 * suave(trecho(t, 2.6, BOOM)) * (1 - vai);
    const tam = misturar(OLHO.tamanho, L.tamanho * 1.12, vai) * carga;
    const brilho = misturar(trecho(t, 1.3, 2.9), 0.75, vai);
    ctx.globalAlpha = trecho(t, 0.3, 1.1) * sai;
    desenharOlho(ctx, ox, oy, tam, t < 1.1 ? 0 : aberturaDoOlho(t), brilho);
    ctx.globalAlpha = 1;

    // o raio
    if (t >= BOOM) {
        const desce = saida(trecho(t, BOOM, IMPACTO));
        const pisca = desdeImpacto < 0 ? 1 : (0.6 + 0.4 * Math.cos(quadro * 2.1)) * (1 - trecho(desdeImpacto, 0.15, 0.7));
        desenharRaio(ctx, RAIO, desce, pisca);
        const [cx, cy] = RAIO.tronco[RAIO.tronco.length - 1];
        // onda de choque no chão
        if (desdeImpacto > 0 && desdeImpacto < 0.9) {
            const p = desdeImpacto / 0.9;
            ctx.save();
            ctx.strokeStyle = `rgba(255,31,45,${1 - p})`;
            ctx.lineWidth = 10 * (1 - p) + 2;
            ctx.shadowColor = COR.vermelho;
            ctx.shadowBlur = 30;
            ctx.beginPath();
            ctx.ellipse(cx, cy, 60 + 900 * saida(p), 18 + 120 * saida(p), 0, Math.PI, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }
        desenharFaiscas(ctx, 9, cx, cy, desdeImpacto, 90);
    }

    // ARG(olho)S
    const letras = saida(trecho(t, 3.55, 4.15)) * sai;
    if (letras > 0) {
        const quente = 1 - trecho(t, 3.9, 4.9);
        ctx.save();
        ctx.globalAlpha = letras;
        ctx.font = `700 ${L.tamanho}px ${FONTE_TITULO}`;
        ctx.letterSpacing = `${Math.round(L.tamanho * 0.08)}px`;
        ctx.textBaseline = 'alphabetic';
        ctx.fillStyle = misturarCor(COR.branco, COR.vermelho, quente * 0.7);
        ctx.shadowColor = COR.vermelho;
        ctx.shadowBlur = 40 * quente + 10;
        const sobe = 30 * (1 - letras);
        ctx.fillText('ARG', L.x0, L.base + sobe);
        ctx.fillText('S', L.x0 + L.arg + L.vao, L.base + sobe);
        ctx.restore();
        legenda(ctx, 'A retirada de faltas do Corpo de Alunos, no celular.', LARGURA / 2, L.base + 110, 40, t, 4.2, LOGO + 0.3, 'center', COR.branco);
    }

    // logo do CIDIT
    const entraLogo = trecho(t, LOGO + 0.1, LOGO + 0.9);
    if (entraLogo > 0) {
        desenharLogoCidit(ctx, LARGURA / 2, 470, 300, saida(entraLogo), misturar(0.82, 1, mola(entraLogo)) + 0.04 * trecho(t, LOGO + 0.9, DURACAO));
        legenda(ctx, 'Um projeto do CIDIT · Corpo de Alunos da EEAR', LARGURA / 2, 880, 44, t, LOGO + 0.8, DURACAO + 1, 'center', COR.branco);
    }

    // clarão do impacto
    if (desdeImpacto > -2 / FPS && desdeImpacto < 0.5) {
        const a = desdeImpacto < 0 ? 0.35 : 0.9 * Math.exp(-desdeImpacto * 9);
        ctx.fillStyle = `rgba(255,${desdeImpacto < 0.05 ? 235 : 60},${desdeImpacto < 0.05 ? 235 : 70},${a})`;
        ctx.fillRect(-50, -50, LARGURA + 100, ALTURA + 100);
    }
    ctx.restore();

    // fim: escurece
    const fim = trecho(t, DURACAO - 0.6, DURACAO);
    if (fim > 0) { ctx.fillStyle = `rgba(0,0,0,${fim})`; ctx.fillRect(0, 0, LARGURA, ALTURA); }
};

window.SCORE = function (ac) {
    const { seco, eco } = mesaDeSom(ac);
    const t0 = ac.currentTime;

    // zumbido grave que cresce até o respiro
    const zumbido = ac.createOscillator();
    zumbido.type = 'sawtooth';
    zumbido.frequency.value = 55;
    const filtro = ac.createBiquadFilter();
    filtro.type = 'lowpass';
    filtro.frequency.setValueAtTime(120, t0);
    filtro.frequency.exponentialRampToValueAtTime(900, t0 + 2.7);
    const g = ac.createGain();
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.18, t0 + 1.2);
    g.gain.linearRampToValueAtTime(0.32, t0 + 2.7);
    g.gain.linearRampToValueAtTime(0.0001, t0 + 2.78);
    zumbido.connect(filtro); filtro.connect(g); g.connect(seco);
    zumbido.start(t0); zumbido.stop(t0 + 2.8);

    somNota(ac, eco, { t: t0 + 1.2, freq: 880, dur: 1.2, vol: 0.06, ataque: 0.3 });
    efeitosDaVinheta(ac, seco, t0);

    // ARGOS: um acorde que acende
    const a = t0 + 3.5;
    [220, 329.63, 440].forEach((f, i) => somNota(ac, eco, { t: a + i * 0.04, freq: f, dur: 1.4, tipo: 'triangle', vol: 0.07, ataque: 0.15, filtro: 2400 }));

    // logo do CIDIT: acorde aberto e um sino
    const l = t0 + LOGO;
    [146.83, 220, 293.66, 369.99, 440].forEach(f => somNota(ac, seco, { t: l, freq: f, dur: 4.5, tipo: 'triangle', vol: 0.08, ataque: 0.02, filtro: 2200 }));
    somNota(ac, eco, { t: l, freq: 1174.66, dur: 2.4, vol: 0.09 });
    somNota(ac, eco, { t: l + 0.5, freq: 1760, dur: 2.0, vol: 0.05 });
};

// Efeitos (sem música): as piscadas, a carga e o BOOM. Entram na trilha sintetizada (SCORE)
// e, sozinhos, na versão com a música de verdade (EFEITOS, ver ferramentas/montar.mjs).
function efeitosDaVinheta(ac, seco, t0) {
    // o olho abre e pisca
    somRuido(ac, seco, { t: t0 + 2.1, dur: 0.08, vol: 0.25, tipo: 'highpass', freq: 3000, semente: 2 });
    somRuido(ac, seco, { t: t0 + 2.55, dur: 0.08, vol: 0.25, tipo: 'highpass', freq: 3000, semente: 3 });
    // carga subindo (ruído com filtro varrendo)
    const carga = somRuido(ac, seco, { t: t0 + 1.8, dur: 0.98, vol: 0.22, tipo: 'bandpass', freq: 400, q: 4, ataque: 0.9, semente: 4 });
    carga.filtro.frequency.setValueAtTime(400, t0 + 1.8);
    carga.filtro.frequency.exponentialRampToValueAtTime(6000, t0 + 2.75);

    // BOOM: estalo, bumbo, trovão
    const b = t0 + BOOM;
    somRuido(ac, seco, { t: b, dur: 0.25, vol: 0.9, tipo: 'highpass', freq: 2500, semente: 5 });
    somBumbo(ac, seco, b + 7 / FPS, 1.0, 34);
    somNota(ac, seco, { t: b + 7 / FPS, freq: 41, dur: 1.8, vol: 0.6, ataque: 0.005 });
    somRuido(ac, seco, { t: b + 7 / FPS, dur: 2.6, vol: 0.75, tipo: 'lowpass', freq: 220, ataque: 0.02, semente: 6 });
}

window.EFEITOS = function (ac) {
    efeitosDaVinheta(ac, mesaDeSom(ac).seco, ac.currentTime);
};

iniciarPrevia();
</script>
</body>
</html>
